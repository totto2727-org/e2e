[package]
name = "cli-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Small async Docker-backed CLI end-to-end test library"
publish = false

[dependencies]
bollard = { version = "0.21", default-features = false, features = ["http", "pipe"] }
bytes = "1"
futures-util = "0.3"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "net", "io-util"] }
