spec-version: 0.36.0
name: caseyard
version: 0.1.0.0
synopsis: Isolated CLI tests against a local Docker Engine
description: Run independently named CLI cases in disposable containers using a caller-built local image.
category: Testing
license: MIT
license-file: LICENSE
build-type: Simple
verbatim:
  cabal-version: '3.0'
extra-source-files:
  - hpack.yaml
  - README.md
  - e2e/CLISpec.md

language: Haskell2010
ghc-options: -Wall -Wcompat
dependencies:
  - base >=4.18 && <5
  - aeson >=2.1 && <2.3
  - async >=2.2 && <2.3
  - bytestring >=0.11 && <0.13
  - containers >=0.6 && <0.9
  - filepath >=1.4 && <1.6
  - http-client >=0.7.13 && <0.8
  - http-types >=0.12 && <0.13
  - network >=3.1 && <3.3
  - tar >=0.6 && <0.8
  - text >=2.0 && <2.2

library:
  source-dirs: src
  exposed-modules: Test.CLI.E2E

tests:
  native:
    main: Spec.hs
    source-dirs: [test, src]
    build-tools: hspec-discover:hspec-discover >=2.10 && <2.12
    dependencies: hspec >=2.10 && <2.12
    ghc-options: -threaded
  docker-e2e:
    main: Spec.hs
    source-dirs: [e2e, src]
    build-tools: hspec-discover:hspec-discover >=2.10 && <2.12
    dependencies: hspec >=2.10 && <2.12
    ghc-options: -threaded
    when:
      - condition: '!flag(docker-e2e)'
        buildable: false

flags:
  docker-e2e:
    description: Enable explicit Docker acceptance tests
    default: false
    manual: true
