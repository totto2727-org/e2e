name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Use the Nix binary cache without waiting for Magic Nix Cache uploads after checks.
      - uses: DeterminateSystems/determinate-nix-action@2a0be2498974c2b6327e19780488744384637d88 # v3.21.7
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - uses: totto2727-org/monorepo/.github/actions/setup-haskell@main
        with:
          dev-shell: ci
      - name: Verify workspace task graph
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#ci")"
          vp run -r ci
