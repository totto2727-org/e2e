name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - name: Install workspace dependencies
        run: nix develop --command bun install --frozen-lockfile
      - name: Check Go modules
        run: |
          nix develop --command vp run check
          nix develop --command vp run --filter @totto2727/e2e-example check
      - name: Test reusable package
        run: nix develop --command vp run test
      - name: Build Go modules
        run: |
          nix develop --command vp run build
          nix develop --command vp run --filter @totto2727/e2e-example build
      - name: Run Docker E2E example
        run: nix develop --command go -C example test -race -shuffle=on -count=1 -v -parallel=2 ./...
