name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - uses: totto2727-org/monorepo/.github/actions/setup-haskell@main
        with:
          dev-shell: ci
      - name: Verify workspace task graph
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#ci")"
          vp run -r ci
