name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.16.1.0'
          cabal-update: false
      - name: Verify workspace task graph
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE")"
          just --working-directory haskell setup
          vp run -r ci
