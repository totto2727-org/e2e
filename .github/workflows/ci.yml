name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [go, haskell, typescript, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - name: Verify ${{ matrix.language }} implementation
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#${{ matrix.language }}")"
          just ${{ matrix.language }}/ci
