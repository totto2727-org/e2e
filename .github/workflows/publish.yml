name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - name: Build npm package
        working-directory: typescript
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          vp run build
      - uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          working-directory: typescript
      - uses: totto2727-org/monorepo/.github/actions/publish-crate@main
        with:
          working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
