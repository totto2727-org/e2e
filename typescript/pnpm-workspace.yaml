packages:
  - .
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# Vite+ requires its bundled Vite and Vitest versions.
# https://viteplus.dev/guide/migrate and https://viteplus.dev/guide/upgrade-project
# Keep these aligned with the installed vite-plus release.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest@*: 5.0.3
allowBuilds:
  vite-plus: false
